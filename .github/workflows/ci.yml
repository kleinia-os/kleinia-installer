name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  packages: write   # publish the artifact image with the workflow token

env:
  KLN_REGISTRY: ${{ vars.KLN_REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -eu
          curl -fsSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks && sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Secret scan
        run: gitleaks detect --source . --redact

  build:
    # build/test/package all run inside the Containerfile (the builder
    # carries the Terra repo for libhelium); the runner only drives podman,
    # which ubuntu-latest preinstalls — public-repo CI stays on GitHub's
    # free hosted runners and keeps working for forks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install just
        # pinned like every other repo in the org; idempotent — becomes a
        # no-op once just is provisioned on the runner natively
        run: |
          set -eu
          command -v just >/dev/null || {
            curl -fsSL -o /tmp/just.tgz \
              https://github.com/casey/just/releases/download/1.59.0/just-1.59.0-x86_64-unknown-linux-musl.tar.gz
            tar -xzf /tmp/just.tgz -C /tmp just
            if [ "$(id -u)" = 0 ]; then install -m 0755 /tmp/just /usr/local/bin/just
            else sudo install -m 0755 /tmp/just /usr/local/bin/just; fi
          }
          just --version
      - name: Build artifact image
        run: just artifact
      - name: Push artifact image
        env:
          KLN_REGISTRY_USER: ${{ secrets.KLN_REGISTRY_USER }}
          KLN_REGISTRY_PASSWORD: ${{ secrets.KLN_REGISTRY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/push.sh
